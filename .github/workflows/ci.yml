name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    name: cpu (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: vision-dev
            extras: --extra vision --extra dev
          - environment: all-extras
            extras: --extra vision --extra dev --extra qwen
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.18'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen ${{ matrix.extras }}
      - name: Verify the documented vision environment excludes PEFT
        if: matrix.environment == 'vision-dev'
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('peft') is None"
      - run: uv run --no-sync ruff check src tests scripts marketing
      - run: uv run --no-sync ruff format --check src tests scripts marketing
      - run: uv run --no-sync pytest -q -ra
      - run: uv run --no-sync python scripts/check_repository.py
      - run: uv run --no-sync openjev-model --help
      - run: uv run --no-sync openjev-branch --help
      - run: uv run --no-sync openjev-vision --help
      - run: uv build
